name: Itential Asset & Integration Validation

on:
  pull_request_review:
    types: [submitted]

jobs:
    diff:
        if: github.event.review.state == 'approved' && github.event.pull_request.base.ref == 'main'
        runs-on: ubuntu-latest
        outputs:
          bundles: ${{ steps.diff.outputs.bundles }}
        steps:
          - name: Checkout trusted scripts
            uses: actions/checkout@v4

          - name: Checkout PR content
            uses: actions/checkout@v4
            with:
              ref: refs/pull/${{ github.event.pull_request.number }}/merge
              fetch-depth: 0
              path: pr
              allow-unsafe-pr-checkout: true

          - name: Find changed files
            id: diff
            working-directory: pr
            env:
              BASE_SHA: ${{ github.event.pull_request.base.sha }}
              INCLUDE_ALL_SPEC_VERSIONS: "true"
            run: bash "$GITHUB_WORKSPACE/.github/scripts/diff.sh"

          - name: Save PR context for deploy
            run: |
              jq -n \
                --argjson pr_number ${{ github.event.pull_request.number }} \
                --argjson bundles '${{ steps.diff.outputs.bundles }}' \
                '{pr_number: $pr_number, bundles: $bundles}' > event.json

          - name: Upload validation artifact
            uses: actions/upload-artifact@v4
            with:
              name: validation-event
              path: event.json
