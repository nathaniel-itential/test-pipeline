name: Itential Asset & Integration Validation

on:
  pull_request_review:
    types: [submitted]

jobs:
    diff:
        if: github.event.review.state == 'approved' && github.event.pull_request.base.ref == 'main'
        runs-on: ubuntu-latest
        outputs:
          bundles: ${{ steps.diff.outputs.bundles }}
        steps:
          - name: Checkout trusted scripts
            uses: actions/checkout@v4

          - name: Checkout PR content
            uses: actions/checkout@v4
            with:
              ref: refs/pull/${{ github.event.pull_request.number }}/merge
              fetch-depth: 0
              path: pr
              allow-unsafe-pr-checkout: true

          - name: Find changed files
            id: diff
            working-directory: pr
            env:
              BASE_SHA: ${{ github.event.pull_request.base.sha }}
              INCLUDE_ALL_SPEC_VERSIONS: "true"
            run: bash "$GITHUB_WORKSPACE/.github/scripts/diff.sh"

    deploy:
        name: "Deploy ${{ matrix.bundle.name }}"
        needs: [diff]
        if: needs.diff.outputs.bundles != '[]'
        strategy:
          fail-fast: false
          matrix:
            bundle: ${{ fromJson(needs.diff.outputs.bundles) }}
        uses: ./.github/workflows/deploy-bundle.yml
        with:
          pr_number: ${{ github.event.pull_request.number }}
          bundle_name: ${{ matrix.bundle.name }}
          changed: ${{ toJson(matrix.bundle.changed) }}
        secrets: inherit
