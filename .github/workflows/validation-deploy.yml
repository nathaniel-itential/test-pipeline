name: Itential Asset & Integration Deploy

on:
  workflow_run:
    workflows: ["Itential Asset & Integration Validation"]
    types: [completed]

jobs:
  load-context:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.context.outputs.pr_number }}
      bundles: ${{ steps.context.outputs.bundles }}
    steps:
      - name: Download validation artifact
        uses: actions/download-artifact@v4
        with:
          name: validation-event
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract PR context
        id: context
        run: |
          PR_NUMBER=$(jq -r .pr_number event.json)

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          {
            echo "bundles<<EOF"
            jq -c .bundles event.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: "Deploy ${{ matrix.bundle.name }}"
    needs: [load-context]
    if: needs.load-context.outputs.bundles != '[]'
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJson(needs.load-context.outputs.bundles) }}
    uses: ./.github/workflows/deploy-bundle.yml
    with:
      pr_number: ${{ needs.load-context.outputs.pr_number }}
      bundle_name: ${{ matrix.bundle.name }}
      changed: ${{ toJson(matrix.bundle.changed) }}
    secrets: inherit
